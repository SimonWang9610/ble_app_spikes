name: BlePocSwiftApp
options:
  bundleIdPrefix: com.spike.blepoc
  deploymentTarget:
    iOS: "17.0"
packages:
  BlePocSwift:
    path: ../../../../rust-interoperability-poc/.worktree/ble-poc-foundation/dist/swift/BlePocSwift
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: XXXXXXXXXX  # or pick the team in Xcode > Signing & Capabilities
targets:
  BlePocSwiftApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: BlePocSwift
      # the Rust static lib (btleplug) uses CoreBluetooth; the package doesn't declare it
      - sdk: CoreBluetooth.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.blepoc.swift
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BLE POC Swift
        NSBluetoothAlwaysUsageDescription: Connects to the HM-BLE-FIXTURE test peripheral.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
